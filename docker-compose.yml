services:
  # ============================================================================
  # 1. RAMP (Runner Image siêu nhẹ ~15MB)
  # Chạy trực tiếp bất kỳ kịch bản nào trong thư mục scenarios/ (tương tự k6)
  # ============================================================================
  ramp:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: capsizer:latest
    container_name: capsizer-ramp
    volumes:
      - .:/data
    env_file:
      - path: .env
        required: false
    command:
      - "-scenario"
      - "scenarios/sample-get"
      - "-steps"
      - "2,4,8"
      - "-step-seconds"
      - "10"
      - "-baseline-wait"
      - "0"

  # ============================================================================
  # 2. PROFILING-SIDECAR (Debug & Thu thập chỉ số hệ thống, RAM, CPU, FlameGraph)
  # ============================================================================
  sidecar:
    build:
      context: .
      dockerfile: profiling-sidecar/Dockerfile
    image: capsizer-profiling-sidecar:latest
    container_name: capsizer-sidecar
    volumes:
      - .:/data
    working_dir: /data
    command:
      - "probe"
      - "-out"
      - "probe.jsonl"
      - "-interval"
      - "1"

  # ============================================================================
  # 3. REPORT (Công cụ phân tích và lập bảng định chuẩn sizing RAM/CPU)
  # ============================================================================
  report:
    image: capsizer:latest
    container_name: capsizer-report
    entrypoint: ["/usr/local/bin/capsizer-report"]
    volumes:
      - .:/data
    working_dir: /data
    command:
      - "-ramp"
      - "loadtest-ramp.jsonl"
      - "-probe"
      - "probe.jsonl"
